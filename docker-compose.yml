services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    environment:
      QUERYMIND_AUDIT_LOG_PATH: /tmp/querymind-audit.log
    volumes:
      - ./app/sample.db:/app/app/sample.db:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
