name: QueryMind CI

on:
  pull_request:
  push:
    branches: [main, feature/querymind-production-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi groq python-dotenv pytest httpx
      - name: Run tests
        env:
          GROQ_API_KEY: ci-placeholder-not-a-real-key
          QUERYMIND_API_KEY: ci-placeholder-not-a-real-key
        run: python -m pytest -q app/tests
