<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NL-to-SQL Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        input[type="text"] {
            width: 70%;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        #sql-box {
            background: #f4f4f4;
            padding: 10px;
            margin-top: 15px;
            font-family: monospace;
        }
        details {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>NL-to-SQL Agent</h1>
    <p>Ask a question about the employee database in plain English.</p>

    <!-- Just an input + button, no <form> needed since we're using fetch() -->
    <label for="api-key-input">API key</label><br>
    <input type="password" id="api-key-input" autocomplete="off" placeholder="Paste your QueryMind API key" style="width:70%;padding:8px;margin:6px 0 12px;">
    <br>
    <label for="question-input">Question</label><br>
    <input type="text" id="question-input" placeholder="e.g. Show me all employees in Engineering">
    <button onclick="askQuestion()">Ask</button>
    <p id="error-message" role="alert" style="color:#a00;"></p>

    <div id="sql-box" style="display: none;"></div>
    <details id="attempts-box" style="display: none;">
        <summary>Agent attempt history</summary>
        <pre id="attempts-content"></pre>
    </details>
    <table id="results-table"></table>

    <script>
        async function askQuestion() {
            const question = document.getElementById("question-input").value.trim();
            const apiKey = document.getElementById("api-key-input").value;
            const errorBox = document.getElementById("error-message");
            errorBox.textContent = "";
            if (!question || !apiKey) {
                errorBox.textContent = "Enter both a question and your API key.";
                return;
            }

            let response;
            let data;
            try {
                response = await fetch("/query", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-Key": apiKey
                    },
                    body: JSON.stringify({ question: question })
                });
                data = await response.json();
            } catch (error) {
                errorBox.textContent = "Could not reach QueryMind API.";
                return;
            }
            if (!response.ok) {
                errorBox.textContent = data.detail || "The request was rejected.";
                return;
            }

            // Show the generated SQL
            const sqlBox = document.getElementById("sql-box");
            sqlBox.style.display = "block";
            const latestAttempt = data.attempts && data.attempts.length > 0
    ? data.attempts[data.attempts.length - 1]
    : {};

const confidence = data.confidence ?? latestAttempt.confidence ?? 0;
const reasoning = data.reasoning ?? latestAttempt.reasoning ?? "No reasoning available.";

sqlBox.textContent =
    "Generated SQL: " + data.final_sql +
    " (Confidence: " + confidence + "/10 — " +
    reasoning + ")";

            // Show the retry history (collapsible, so it doesn't clutter the UI)
            const attemptsBox = document.getElementById("attempts-box");
            const attemptsContent = document.getElementById("attempts-content");
            attemptsBox.style.display = "block";
            attemptsContent.textContent = JSON.stringify(data.attempts, null, 2);

            // Build the results table dynamically from whatever columns came back
            const table = document.getElementById("results-table");
            table.innerHTML = "";

            if (data.results && data.results.length > 0) {
                const headers = Object.keys(data.results[0]);
                const headerRow = document.createElement("tr");
                headers.forEach(h => {
                    const th = document.createElement("th");
                    th.textContent = h;
                    headerRow.appendChild(th); 
                });
                table.appendChild(headerRow);

                data.results.forEach(row => {
                    const tr = document.createElement("tr");
                    headers.forEach(h => {
                        const td = document.createElement("td");
                        td.textContent = row[h];
                        tr.appendChild(td);
                    });
                    table.appendChild(tr);
                });
            } else {
                table.innerHTML = "<tr><td>No results (or query failed)</td></tr>";
            }
        }
    </script>
</body>
</html>
